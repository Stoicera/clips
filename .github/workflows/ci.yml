# .github/workflows/ci.yml — Stoicera baseline (ai/ENGINEERING.md §7).
# Steps run for the stack that is present (package.json → pnpm, pyproject.toml → uv).
# The final job "ci" is the required status check of the organisation ruleset.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - id: stack
        run: |
          [ -f package.json ] && echo node=true >> "$GITHUB_OUTPUT" || true
          [ -f pyproject.toml ] && echo python=true >> "$GITHUB_OUTPUT" || true
          [ -f Dockerfile ] && echo docker=true >> "$GITHUB_OUTPUT" || true

      # Node / TypeScript
      - if: steps.stack.outputs.node == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.stack.outputs.node == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.stack.outputs.node == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test -- --coverage
          pnpm build
          pnpm audit --audit-level=high

      # Python
      - if: steps.stack.outputs.python == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.stack.outputs.python == 'true'
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest --cov
          uv run pip-audit || uvx pip-audit

      # Container
      - if: steps.stack.outputs.docker == 'true'
        run: docker build -t app:${{ github.sha }} .
      - if: steps.stack.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  ci:
    # Aggregate gate: the organisation ruleset requires this check by name.
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = "success"
